<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aydin - La Bande</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      background: #0a0e27;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.03) 2px, rgba(0,255,255,0.03) 4px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,255,255,0.03) 2px, rgba(0,255,255,0.03) 4px);
      font-family: 'Press Start 2P', cursive;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      image-rendering: pixelated;
    }
    .profile-container {
      background: #1a1a2e;
      border: 5px solid #00ff2a; box-shadow: 0 0 0 3px #00ff2a, 0 0 40px #00ff2a, inset 0 0 30px #00ff2a;
      padding: 50px 40px; max-width: 350px; text-align: center; position: relative; z-index: 2;
    }
    .profile-image {
      width: 130px; height: 130px;
      object-fit: cover; margin-bottom: 15px;
      border: 4px solid #00ff2a; box-shadow: 0 0 8px #00ff2a, inset 0 0 12px #00ff2a;
      image-rendering: pixelated; filter: contrast(1.2) saturate(1.3);
    }
    h1 {
      font-size: 1.3rem; color: #00ff2a; margin-bottom: 16px;
      text-shadow: 3px 3px #ffea00,0 0 20px #00ff2a; letter-spacing: 0.13em;
    }
    .role { font-size: 0.7rem; color: #00ff2a; margin-bottom: 18px; text-shadow: 2px 2px #00ff2a69;}
    .stats { margin: 18px 0; text-align: left;}
    .stat-bar {margin: 11px 0;}
    .stat-label { color:#fffb00; font-size: 0.63rem; margin-bottom: 4px;}
    .stat-value { height: 16px; background: #0a0e27; border: 2px solid #00ff2a; position: relative; }
    .stat-fill { height: 100%; background: linear-gradient(90deg,#00ff2a,#fffb00); box-shadow: 0 0 6px #fffb00; animation: fillBar 1.5s ease-out;}
    @keyframes fillBar { 0% { width: 0%; } }
    .description { font-size: 0.66rem; color: #c0c0c0; line-height: 1.7; margin-bottom: 25px; text-align: left;}
    .back-button {
      display: inline-block; padding: 12px 22px; background:#00ff2abb; color: #00ff2a; text-decoration: none;
      font-size: 0.7rem; border: 3px solid #00ff2a; box-shadow: 0 0 12px #ffa600, inset 0 0 10px #ffee0044;
      transition: all 0.3s; position: relative; text-shadow: 2px 2px #ffd000;
    }
    .back-button:hover { background: #ffffff; color: #ffffff; border-color: #ffffff; box-shadow: 0 0 18px #ffa600, inset 0 0 15px #ff0000; transform: scale(1.05);}
    @media (max-width: 700px) { .profile-container { padding: 30px 8px; border-width:3px;} h1{font-size:1rem;} }
  </style>
</head>
<body>
  <div class="profile-container">
    <img src="Aydin.jpg" alt="Aydin" class="profile-image">
    <h1>AYDIN</h1>
    <div class="role">le musclesse ★</div>
    <!-- 5 statistiques -->
    <div class="stats">
      <div class="stat-bar">
        <div class="stat-label">"INTELLIGENCE"</div>
        <div class="stat-value"><div class="stat-fill" style="width: 80%;"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">HUMOUR</div>
        <div class="stat-value"><div class="stat-fill" style="width: 90%;"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">REFLEX</div>
        <div class="stat-value"><div class="stat-fill" style="width: 79%;"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">SPORT</div>
        <div class="stat-value"><div class="stat-fill" style="width: 92%;"></div></div>
      </div>
      <div class="stat-bar">
        <div class="stat-label">CONDUITE</div>
        <div class="stat-value"><div class="stat-fill" style="width: 80%;"></div></div>
      </div>
    </div>
    <div class="description">
      <p>le musclesse de la bande, toujours prêt à soutenir ses amis avec des ressources et des conseils. Sa connaissance approfondie de la salle de SPORT et de la musculation en fait un atout précieux pour la santé du groupe.</p>
    </div>
    <a href="index.html" class="back-button">◄◄ RETOUR</a>
  </div>
</body>
</html>
