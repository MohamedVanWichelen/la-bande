<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Bande</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    body {
      background: #0a0e27;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,255,0.03) 2px, rgba(0,255,255,0.03) 4px), repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,255,255,0.03) 2px, rgba(0,255,255,0.03) 4px);
      font-family: 'Press Start 2P', cursive;
      margin: 0; padding: 0;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      image-rendering: pixelated;
    }
    h1 {
      text-align: center;
      margin-bottom: 60px;
      font-size: 2.2rem;
      color: #00ff41;
      letter-spacing: 0.12em;
      text-shadow: 2px 2px #ff00ff,0 0 20px #00ff41;
      animation: glitch 3s infinite;
      position: relative; z-index: 2;
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-2px, 2px); }
      94% { transform: translate(2px, -2px); }
      96% { transform: translate(-2px, -2px); }
    }
    .cards-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 2rem; flex-wrap: wrap; padding: 20px; z-index: 2; position: relative;
    }
    .card {
      width: 160px; height: 200px;
      background: #1a1a2e;
      border: 4px solid #00ff41; box-shadow: 0 0 0 2px #0a0e27, 0 0 20px rgba(0,255,65,0.5), inset 0 0 20px rgba(0,255,65,0.1);
      overflow: hidden; cursor: pointer; position: relative;
      filter: blur(2px) brightness(0.6);
      transform: scale(0.85); opacity: 0.7;
      transition: all 0.3s cubic-bezier(.68,-.55,.265,1.55);
      text-decoration: none; display: block; image-rendering: pixelated;
    }
    .card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      image-rendering: pixelated; filter: contrast(1.2) saturate(1.3);
    }
    .card-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.9);
      color: #00ff41; padding: 12px 6px; text-align: center; font-size: 0.7rem;
      text-shadow: 2px 2px 0px #ff00ff; border-top: 3px solid #00ff41;
    }
    .card:hover {
      filter: blur(0px) brightness(1.2);
      transform: scale(1.1); opacity: 1; border-color: #ff00ff;
      box-shadow: 0 0 0 2px #0a0e27, 0 0 30px #ff00ff, 0 0 50px #00ffff;
      z-index: 10; animation: pixelPulse 0.3s ease;
    }
    @keyframes pixelPulse {
      0%,100% { transform: scale(1.1);}
      50% { transform: scale(1.15);}
    }
    .card:hover .card-content {
      background: rgba(255,0,255,0.3);
      color: #00ffff; text-shadow: 2px 2px 0px #00ff41; border-top-color: #ff00ff;
    }
    @media (max-width: 900px) { .cards-container { flex-direction: column; gap: 1rem;}
      .card{width:85vw;max-width:200px;}}
  </style>
</head>
<body>
  <h1>LA BANDE</h1>
  <div class="cards-container">
    <a href="Hatim.html" class="card">
      <img src="Hatim.jpg" alt="Hatim">
      <div class="card-content">Hatim</div>
    </a>
    <a href="rayan.html" class="card">
      <img src="Rayan.jpg" alt="Rayan">
      <div class="card-content">Rayan</div>
    </a>
    <a href="terence.html" class="card">
      <img src="Terence.jpg" alt="Terence">
      <div class="card-content">Terence</div>
    </a>
    <a href="aydin.html" class="card">
      <img src="Aydin.jpg" alt="Aydin">
      <div class="card-content">Aydin</div>
    </a>
    <a href="mohamed.html" class="card">
      <img src="Mohamed.jpg" alt="Mohamed">
      <div class="card-content">Mohamed</div>
    </a>
  </div>
</body>
</html>
